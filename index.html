<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patil Associate — Find Your Place</title>
<meta name="description" content="Patil Associate — premium property consulting, buying, selling and renting.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="home">
<div id="site-header"></div>
<main>
<section class="hero" style="--hero:url(https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&fit=crop&w=2000&q=80)">
  <div class="wrap hero-inner">
    <div class="eyebrow" data-i="heroEyebrow"></div>
    <h1><span data-i="heroTitle1"></span> <em data-i="heroTitle2"></em> <span data-i="heroTitle3"></span></h1>
    <p data-i="heroText"></p>
    <div class="hero-actions">
      <a href="properties.html" class="btn btn-light"><span data-i="explore"></span> ↗</a>
      <a href="contact.html" class="btn btn-ghost-light" data-i="contactUs"></a>
    </div>
  </div>
</section>

<section class="section wrap">
  <div class="section-head">
    <div><div class="kicker" data-i="featuredKicker"></div><h2 data-i="featuredTitle"></h2></div>
    <p class="lead" data-i="featuredText"></p>
  </div>
  <div class="grid" id="featured"></div>
  <div style="text-align:center;margin-top:40px"><a href="properties.html" class="btn"><span data-i="viewAll"></span> ↗</a></div>
</section>

<section class="section wrap" style="padding-top:0">
  <div class="section-head">
    <div><div class="kicker" data-i="servicesKicker"></div><h2 data-i="servicesTitle"></h2></div>
  </div>
  <div class="services">
    <div class="service reveal"><span class="num">01</span><h3 data-i="s1t"></h3><p data-i="s1d"></p></div>
    <div class="service reveal"><span class="num">02</span><h3 data-i="s2t"></h3><p data-i="s2d"></p></div>
    <div class="service reveal"><span class="num">03</span><h3 data-i="s3t"></h3><p data-i="s3d"></p></div>
    <div class="service reveal"><span class="num">04</span><h3 data-i="s4t"></h3><p data-i="s4d"></p></div>
  </div>
</section>

<section class="section dark-band">
  <div class="wrap">
    <div class="section-head">
      <div><div class="kicker" data-i="videosKicker"></div><h2 data-i="videosTitle"></h2></div>
      <a href="videos.html" class="btn btn-ghost-light"><span data-i="navVideos"></span> ↗</a>
    </div>
    <div class="videos" id="homeVideos"></div>
  </div>
</section>

<section class="section cta" style="--cta:url(https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1600&q=80)">
  <div class="wrap">
    <h2 data-i="ctaTitle"></h2>
    <p data-i="ctaText"></p>
    <a href="contact.html" class="btn btn-light"><span data-i="contactUs"></span> ↗</a>
  </div>
</section>
</main>
<div id="site-footer"></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
