<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Patil Associate</title>
<meta name="description" content="Patil Associate — premium property consulting, buying, selling and renting.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="login">
<div id="site-header"></div>
<main>
<div class="narrow panel">
  <div class="kicker">PATIL ASSOCIATE</div>
  <h1 data-i="welcome"></h1>
  <form class="form" id="loginForm">
    <div class="field"><label for="l-email" data-i="email"></label><input id="l-email" type="email" required autocomplete="username"></div>
    <div class="field"><label for="l-pass" data-i="password"></label><input id="l-pass" type="password" required autocomplete="current-password"></div>
    <button class="btn btn-dark btn-block" type="submit"><span data-i="signIn"></span> ↗</button>
    <p class="note" data-i="loginNote"></p>
  </form>
</div>
</main>
<div id="site-footer"></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
